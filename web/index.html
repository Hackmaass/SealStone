<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sealstone</title>
      <meta name="theme-color" content="#F6F5FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0D14" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The app (not the landing page) starts dark unless the person chose light: set it before the first paint so there is no flash.
      (function () {
        if (location.pathname === "/") return;
        var t = "dark";
        try { t = localStorage.getItem("mv.theme") || "dark"; } catch (_) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <script>
      // Some machines intermittently refuse a loopback request (net::ERR_NETWORK_ACCESS_DENIED), which leaves the page blank or
      // unstyled. If a script or stylesheet fails to load, reload (at most 3 times); the counter clears once a page loads cleanly.
      (function () {
        var KEY = "sealstone-load-retries";
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
          var n = 0;
          try { n = Number(sessionStorage.getItem(KEY)) || 0; } catch (_) {}
          if (n >= 3) return;
          try { sessionStorage.setItem(KEY, String(n + 1)); } catch (_) {}
          setTimeout(function () { location.reload(); }, 300 * (n + 1));
        }, true);
        window.addEventListener("load", function () {
          setTimeout(function () { try { sessionStorage.removeItem(KEY); } catch (_) {} }, 3000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
